name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r services/warehouse-api/requirements.txt
          pip install -r services/workers/requirements.txt
          pip install -r services/central/requirements.txt
          pip install -r services/batch/requirements.txt
          pip install -r services/lambda/requirements.txt
          pip install -r services/iot-ingestion/requirements.txt
          pip install -r services/iot-simulator/requirements.txt
          pip install -e libs/common

      - name: Lint
        run: |
          pip install ruff
          ruff check .

      - name: Tests
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API
        run: docker build -f services/warehouse-api/Dockerfile -t warehouse-api:ci .

      - name: Build Frontend
        run: docker build -f services/frontend/app/Dockerfile -t warehouse-frontend:ci .

      - name: Build Central
        run: docker build -f services/central/Dockerfile -t warehouse-central:ci .

      - name: Build Workers
        run: docker build -f services/workers/Dockerfile -t warehouse-workers:ci .

      - name: Build Batch
        run: docker build -f services/batch/Dockerfile -t warehouse-batch:ci services/batch
