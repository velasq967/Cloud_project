name: warehouse-multi

# Fase 4: 3 bodegas, cada una con su API, postgres y redis. RabbitMQ es compartido.
# Puertos: WH-001 8001/8081, WH-002 8002/8082 (nginx -> 3 apis), WH-003 8003/8083
# make up-multi  (apagar antes compose.core.yml)

x-api-build: &api-build
  build:
    context: ../..
    dockerfile: services/warehouse-api/Dockerfile
  image: warehouse-api:local
  restart: unless-stopped

x-worker-build: &worker-build
  build:
    context: ../..
    dockerfile: services/workers/Dockerfile
  image: warehouse-workers:local
  restart: unless-stopped

x-frontend-build: &frontend-build
  build:
    context: ../..
    dockerfile: services/frontend/app/Dockerfile
  image: warehouse-frontend:local
  restart: unless-stopped

x-postgres: &postgres
  image: postgres:16-alpine
  restart: unless-stopped
  environment:
    POSTGRES_USER: ${POSTGRES_USER:-warehouse_user}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-warehouse_pass}
    POSTGRES_DB: ${POSTGRES_DB:-warehouse_db}
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-warehouse_user} -d ${POSTGRES_DB:-warehouse_db}"]
    interval: 5s
    timeout: 5s
    retries: 12

x-redis: &redis
  image: redis:7-alpine
  restart: unless-stopped
  command: ["redis-server", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 5s
    timeout: 3s
    retries: 12

x-api-healthcheck: &api-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
  interval: 10s
  timeout: 5s
  retries: 8
  start_period: 20s

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: multi_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-warehouse}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-warehouse_pass}
      RABBITMQ_ENABLED_PLUGINS: "rabbitmq_management,rabbitmq_prometheus"
      RABBITMQ_ENABLED_PLUGINS_FILE: "/var/lib/rabbitmq/enabled_plugins"
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
      - "${RABBITMQ_PROMETHEUS_PORT:-15692}:15692"
    volumes:
      - multi_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 60s

  # WH-001
  wh001-db:
    <<: *postgres
    container_name: wh001-db
    ports:
      - "5441:5432"
    volumes:
      - wh001_postgres_data:/var/lib/postgresql/data

  wh001-redis:
    <<: *redis
    container_name: wh001-redis
    ports:
      - "6381:6379"

  wh001-api:
    <<: *api-build
    container_name: wh001-api
    environment:
      WAREHOUSE_ID: WH-001
      WAREHOUSE_NAME: "Bodega Norte (baja actividad)"
      DATABASE_URL: postgresql://${POSTGRES_USER:-warehouse_user}:${POSTGRES_PASSWORD:-warehouse_pass}@wh001-db:5432/${POSTGRES_DB:-warehouse_db}
      REDIS_URL: redis://wh001-redis:6379/0
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-30}
      RABBITMQ_ENABLED: ${RABBITMQ_ENABLED:-true}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-warehouse}:${RABBITMQ_PASSWORD:-warehouse_pass}@rabbitmq:5672/%2F
      RABBITMQ_EXCHANGE: warehouse.events
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ALLOW_FAULT_INJECTION: "true"
      SEED_ON_START: "true"
    ports:
      - "8001:8000"
    depends_on:
      wh001-db:
        condition: service_healthy
      wh001-redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    healthcheck: *api-healthcheck

  wh001-audit-worker:
    <<: *worker-build
    container_name: wh001-audit-worker
    command: ["python", "-m", "audit_worker.main"]
    environment:
      WAREHOUSE_ID: WH-001
      DATABASE_URL: postgresql://${POSTGRES_USER:-warehouse_user}:${POSTGRES_PASSWORD:-warehouse_pass}@wh001-db:5432/${POSTGRES_DB:-warehouse_db}
      REDIS_URL: redis://wh001-redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-warehouse}:${RABBITMQ_PASSWORD:-warehouse_pass}@rabbitmq:5672/%2F
      RABBITMQ_EXCHANGE: warehouse.events
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      wh001-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  wh001-cache-worker:
    <<: *worker-build
    container_name: wh001-cache-worker
    command: ["python", "-m", "cache_worker.main"]
    environment:
      WAREHOUSE_ID: WH-001
      DATABASE_URL: postgresql://${POSTGRES_USER:-warehouse_user}:${POSTGRES_PASSWORD:-warehouse_pass}@wh001-db:5432/${POSTGRES_DB:-warehouse_db}
      REDIS_URL: redis://wh001-redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-warehouse}:${RABBITMQ_PASSWORD:-warehouse_pass}@rabbitmq:5672/%2F
      RABBITMQ_EXCHANGE: warehouse.events
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      wh001-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  wh001-report-worker:
    <<: *worker-build
    container_name: wh001-report-worker
    command: ["python", "-m", "report_worker.main"]
    environment:
      WAREHOUSE_ID: WH-001
      DATABASE_URL: postgresql://${POSTGRES_USER:-warehouse_user}:${POSTGRES_PASSWORD:-warehouse_pass}@wh001-db:5432/${POSTGRES_DB:-warehouse_db}
      REDIS_URL: redis://wh001-redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-warehouse}:${RABBITMQ_PASSWORD:-warehouse_pass}@rabbitmq:5672/%2F
      RABBITMQ_EXCHANGE: warehouse.events
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      wh001-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  wh001-outbox-worker:
    <<: *worker-build
    container_name: wh001-outbox-worker
    command: ["python", "-m", "outbox_worker.main"]
    environment:
      WAREHOUSE_ID: WH-001
      DATABASE_URL: postgresql://${POSTGRES_USER:-warehouse_user}:${POSTGRES_PASSWORD:-warehouse_pass}@wh001-db:5432/${POSTGRES_DB:-warehouse_db}
      REDIS_URL: redis://wh001-redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-warehouse}:${RABBITMQ_PASSWORD:-warehouse_pass}@rabbitmq:5672/%2F
      RABBITMQ_EXCHANGE: warehouse.events
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      wh001-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  wh001-frontend:
    <<: *frontend-build
    container_name: wh001-frontend
    environment:
      API_TARGET: wh001-api:8000
    ports:
      - "8081:80"
    depends_on:
      wh001-api:
        condition: service_healthy

  # WH-002
  wh002-db:
    <<: *postgres
    container_name: wh002-db
    ports:
      - "5442:5432"
    volumes:
      - wh002_postgres_data:/var/lib/postgresql/data

  wh002-redis:
    <<: *redis
    container_name: wh002-redis
    ports:
      - "6382:6379"

  # WH-002: 3 replicas de la api detras de nginx (fase 5)
  wh002-api-1:
    <<: *api-build
    container_name: wh002-api-1
    cpus: 1.0
    environment:
      WAREHOUSE_ID: WH-002
      WAREHOUSE_NAME: "Bodega Centro (alta lectura)"
      DATABASE_URL: postgresql://${POSTGRES_USER:-warehouse_user}:${POSTGRES_PASSWORD:-warehouse_pass}@wh002-db:5432/${POSTGRES_DB:-warehouse_db}
      REDIS_URL: redis://wh002-redis:6379/0
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-30}
      RABBITMQ_ENABLED: ${RABBITMQ_ENABLED:-true}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-warehouse}:${RABBITMQ_PASSWORD:-warehouse_pass}@rabbitmq:5672/%2F
      RABBITMQ_EXCHANGE: warehouse.events
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ALLOW_FAULT_INJECTION: "true"
      SEED_ON_START: "true"
      INSTANCE_ID: wh002-api-1
    depends_on:
      wh002-db:
        condition: service_healthy
      wh002-redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    healthcheck: *api-healthcheck

  wh002-api-2:
    <<: *api-build
    container_name: wh002-api-2
    cpus: 1.0
    environment:
      WAREHOUSE_ID: WH-002
      WAREHOUSE_NAME: "Bodega Centro (alta lectura)"
      DATABASE_URL: postgresql://${POSTGRES_USER:-warehouse_user}:${POSTGRES_PASSWORD:-warehouse_pass}@wh002-db:5432/${POSTGRES_DB:-warehouse_db}
      REDIS_URL: redis://wh002-redis:6379/0
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-30}
      RABBITMQ_ENABLED: ${RABBITMQ_ENABLED:-true}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-warehouse}:${RABBITMQ_PASSWORD:-warehouse_pass}@rabbitmq:5672/%2F
      RABBITMQ_EXCHANGE: warehouse.events
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ALLOW_FAULT_INJECTION: "true"
      SEED_ON_START: "false"
      INSTANCE_ID: wh002-api-2
    depends_on:
      wh002-api-1:
        condition: service_healthy
    healthcheck: *api-healthcheck

  wh002-api-3:
    <<: *api-build
    container_name: wh002-api-3
    cpus: 1.0
    environment:
      WAREHOUSE_ID: WH-002
      WAREHOUSE_NAME: "Bodega Centro (alta lectura)"
      DATABASE_URL: postgresql://${POSTGRES_USER:-warehouse_user}:${POSTGRES_PASSWORD:-warehouse_pass}@wh002-db:5432/${POSTGRES_DB:-warehouse_db}
      REDIS_URL: redis://wh002-redis:6379/0
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-30}
      RABBITMQ_ENABLED: ${RABBITMQ_ENABLED:-true}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-warehouse}:${RABBITMQ_PASSWORD:-warehouse_pass}@rabbitmq:5672/%2F
      RABBITMQ_EXCHANGE: warehouse.events
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ALLOW_FAULT_INJECTION: "true"
      SEED_ON_START: "false"
      INSTANCE_ID: wh002-api-3
    depends_on:
      wh002-api-1:
        condition: service_healthy
    healthcheck: *api-healthcheck

  wh002-lb:
    image: nginx:1.28-alpine
    container_name: wh002-lb
    volumes:
      - ../../services/load-balancer/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8002:80"
    depends_on:
      wh002-api-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/lb-health"]
      interval: 10s
      timeout: 3s
      retries: 3

  wh002-audit-worker:
    <<: *worker-build
    container_name: wh002-audit-worker
    command: ["python", "-m", "audit_worker.main"]
    environment:
      WAREHOUSE_ID: WH-002
      DATABASE_URL: postgresql://${POSTGRES_USER:-warehouse_user}:${POSTGRES_PASSWORD:-warehouse_pass}@wh002-db:5432/${POSTGRES_DB:-warehouse_db}
      REDIS_URL: redis://wh002-redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-warehouse}:${RABBITMQ_PASSWORD:-warehouse_pass}@rabbitmq:5672/%2F
      RABBITMQ_EXCHANGE: warehouse.events
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      wh002-api-1:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  wh002-cache-worker:
    <<: *worker-build
    container_name: wh002-cache-worker
    command: ["python", "-m", "cache_worker.main"]
    environment:
      WAREHOUSE_ID: WH-002
      DATABASE_URL: postgresql://${POSTGRES_USER:-warehouse_user}:${POSTGRES_PASSWORD:-warehouse_pass}@wh002-db:5432/${POSTGRES_DB:-warehouse_db}
      REDIS_URL: redis://wh002-redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-warehouse}:${RABBITMQ_PASSWORD:-warehouse_pass}@rabbitmq:5672/%2F
      RABBITMQ_EXCHANGE: warehouse.events
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      wh002-api-1:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  wh002-report-worker:
    <<: *worker-build
    container_name: wh002-report-worker
    command: ["python", "-m", "report_worker.main"]
    environment:
      WAREHOUSE_ID: WH-002
      DATABASE_URL: postgresql://${POSTGRES_USER:-warehouse_user}:${POSTGRES_PASSWORD:-warehouse_pass}@wh002-db:5432/${POSTGRES_DB:-warehouse_db}
      REDIS_URL: redis://wh002-redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-warehouse}:${RABBITMQ_PASSWORD:-warehouse_pass}@rabbitmq:5672/%2F
      RABBITMQ_EXCHANGE: warehouse.events
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      wh002-api-1:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  wh002-outbox-worker:
    <<: *worker-build
    container_name: wh002-outbox-worker
    command: ["python", "-m", "outbox_worker.main"]
    environment:
      WAREHOUSE_ID: WH-002
      DATABASE_URL: postgresql://${POSTGRES_USER:-warehouse_user}:${POSTGRES_PASSWORD:-warehouse_pass}@wh002-db:5432/${POSTGRES_DB:-warehouse_db}
      REDIS_URL: redis://wh002-redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-warehouse}:${RABBITMQ_PASSWORD:-warehouse_pass}@rabbitmq:5672/%2F
      RABBITMQ_EXCHANGE: warehouse.events
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      wh002-api-1:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  wh002-frontend:
    <<: *frontend-build
    container_name: wh002-frontend
    environment:
      API_TARGET: wh002-lb:80
    ports:
      - "8082:80"
    depends_on:
      wh002-lb:
        condition: service_started

  # WH-003
  wh003-db:
    <<: *postgres
    container_name: wh003-db
    ports:
      - "5443:5432"
    volumes:
      - wh003_postgres_data:/var/lib/postgresql/data

  wh003-redis:
    <<: *redis
    container_name: wh003-redis
    ports:
      - "6383:6379"

  wh003-api:
    <<: *api-build
    container_name: wh003-api
    environment:
      WAREHOUSE_ID: WH-003
      WAREHOUSE_NAME: "Bodega Sur (baja actividad)"
      DATABASE_URL: postgresql://${POSTGRES_USER:-warehouse_user}:${POSTGRES_PASSWORD:-warehouse_pass}@wh003-db:5432/${POSTGRES_DB:-warehouse_db}
      REDIS_URL: redis://wh003-redis:6379/0
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-30}
      RABBITMQ_ENABLED: ${RABBITMQ_ENABLED:-true}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-warehouse}:${RABBITMQ_PASSWORD:-warehouse_pass}@rabbitmq:5672/%2F
      RABBITMQ_EXCHANGE: warehouse.events
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ALLOW_FAULT_INJECTION: "true"
      SEED_ON_START: "true"
    ports:
      - "8003:8000"
    depends_on:
      wh003-db:
        condition: service_healthy
      wh003-redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    healthcheck: *api-healthcheck

  wh003-audit-worker:
    <<: *worker-build
    container_name: wh003-audit-worker
    command: ["python", "-m", "audit_worker.main"]
    environment:
      WAREHOUSE_ID: WH-003
      DATABASE_URL: postgresql://${POSTGRES_USER:-warehouse_user}:${POSTGRES_PASSWORD:-warehouse_pass}@wh003-db:5432/${POSTGRES_DB:-warehouse_db}
      REDIS_URL: redis://wh003-redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-warehouse}:${RABBITMQ_PASSWORD:-warehouse_pass}@rabbitmq:5672/%2F
      RABBITMQ_EXCHANGE: warehouse.events
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      wh003-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  wh003-cache-worker:
    <<: *worker-build
    container_name: wh003-cache-worker
    command: ["python", "-m", "cache_worker.main"]
    environment:
      WAREHOUSE_ID: WH-003
      DATABASE_URL: postgresql://${POSTGRES_USER:-warehouse_user}:${POSTGRES_PASSWORD:-warehouse_pass}@wh003-db:5432/${POSTGRES_DB:-warehouse_db}
      REDIS_URL: redis://wh003-redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-warehouse}:${RABBITMQ_PASSWORD:-warehouse_pass}@rabbitmq:5672/%2F
      RABBITMQ_EXCHANGE: warehouse.events
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      wh003-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  wh003-report-worker:
    <<: *worker-build
    container_name: wh003-report-worker
    command: ["python", "-m", "report_worker.main"]
    environment:
      WAREHOUSE_ID: WH-003
      DATABASE_URL: postgresql://${POSTGRES_USER:-warehouse_user}:${POSTGRES_PASSWORD:-warehouse_pass}@wh003-db:5432/${POSTGRES_DB:-warehouse_db}
      REDIS_URL: redis://wh003-redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-warehouse}:${RABBITMQ_PASSWORD:-warehouse_pass}@rabbitmq:5672/%2F
      RABBITMQ_EXCHANGE: warehouse.events
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      wh003-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  wh003-outbox-worker:
    <<: *worker-build
    container_name: wh003-outbox-worker
    command: ["python", "-m", "outbox_worker.main"]
    environment:
      WAREHOUSE_ID: WH-003
      DATABASE_URL: postgresql://${POSTGRES_USER:-warehouse_user}:${POSTGRES_PASSWORD:-warehouse_pass}@wh003-db:5432/${POSTGRES_DB:-warehouse_db}
      REDIS_URL: redis://wh003-redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-warehouse}:${RABBITMQ_PASSWORD:-warehouse_pass}@rabbitmq:5672/%2F
      RABBITMQ_EXCHANGE: warehouse.events
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      wh003-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  wh003-frontend:
    <<: *frontend-build
    container_name: wh003-frontend
    environment:
      API_TARGET: wh003-api:8000
    ports:
      - "8083:80"
    depends_on:
      wh003-api:
        condition: service_healthy


  # central: orquestador de transferencias (fase 6)
  central-db:
    image: postgres:16-alpine
    container_name: central-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-warehouse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-warehouse_pass}
      POSTGRES_DB: central_db
    ports:
      - "5450:5432"
    volumes:
      - central_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-warehouse_user} -d central_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  central-api:
    build:
      context: ../..
      dockerfile: services/central/Dockerfile
    image: warehouse-central:local
    container_name: central-api
    environment: &central-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-warehouse_user}:${POSTGRES_PASSWORD:-warehouse_pass}@central-db:5432/central_db
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-warehouse}:${RABBITMQ_PASSWORD:-warehouse_pass}@rabbitmq:5672/%2F
      RABBITMQ_EXCHANGE: warehouse.events
      WAREHOUSE_URLS: WH-001=http://wh001-api:8000,WH-002=http://wh002-lb,WH-003=http://wh003-api:8000
      REQUEST_TIMEOUT: "3"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8010:8000"
    depends_on:
      central-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 6

  transfer-worker:
    image: warehouse-central:local
    container_name: transfer-worker
    command: ["python", "-m", "central.worker"]
    environment: *central-env
    depends_on:
      central-api:
        condition: service_healthy


  # fase 7: mantiene el read model global_inventory con los eventos de las bodegas
  projection-worker:
    image: warehouse-central:local
    container_name: projection-worker
    command: ["python", "-m", "central.projection_worker"]
    environment: *central-env
    depends_on:
      central-api:
        condition: service_healthy
      wh001-api:
        condition: service_healthy
      wh002-lb:
        condition: service_started
      wh003-api:
        condition: service_healthy
  
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: warehouse-prometheus
    profiles: ["observability"]
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - rabbitmq
      - central-api

  # fase 12: IoT (perfil opcional)
  mosquitto:
    build:
      context: ../..
      dockerfile: services/mosquitto/Dockerfile
    container_name: warehouse-mosquitto
    profiles: ["iot"]
    ports:
      - "1883:1883"
    volumes:
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h 127.0.0.1 -p 1883 -u warehouse -P warehouse_pass -t '$$SYS/broker/uptime' -C 1 -W 3",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  iot-ingestion:
    build:
      context: ../..
      dockerfile: services/iot-ingestion/Dockerfile
    container_name: warehouse-iot-ingestion
    profiles: ["iot"]
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USER: warehouse
      MQTT_PASSWORD: warehouse_pass
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-warehouse}:${RABBITMQ_PASSWORD:-warehouse_pass}@rabbitmq:5672/%2F
      RABBITMQ_EXCHANGE: warehouse.events
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      mosquitto:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  iot-simulator:
    build:
      context: ../..
      dockerfile: services/iot-simulator/Dockerfile
    container_name: warehouse-iot-simulator
    profiles: ["iot"]
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USER: warehouse
      MQTT_PASSWORD: warehouse_pass
      WAREHOUSES: WH-001,WH-002,WH-003
      INTERVAL_SECONDS: ${IOT_INTERVAL_SECONDS:-5}
      DB_PATH: /data/simulator_buffer.db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - iot_sim_data:/data
    depends_on:
      mosquitto:
        condition: service_healthy

  iot-storage-worker:
    image: warehouse-workers:local
    container_name: warehouse-iot-storage
    profiles: ["iot"]
    command: ["python", "-m", "iot_storage_worker.main"]
    environment: &iot-worker-env
      WAREHOUSE_ID: CENTRAL
      DATABASE_URL: postgresql://${POSTGRES_USER:-warehouse_user}:${POSTGRES_PASSWORD:-warehouse_pass}@central-db:5432/central_db
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-warehouse}:${RABBITMQ_PASSWORD:-warehouse_pass}@rabbitmq:5672/%2F
      RABBITMQ_EXCHANGE: warehouse.events
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      central-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  iot-alert-worker:
    image: warehouse-workers:local
    container_name: warehouse-iot-alerts
    profiles: ["iot"]
    command: ["python", "-m", "iot_alert_worker.main"]
    environment: *iot-worker-env
    depends_on:
      central-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  iot-analytics-worker:
    image: warehouse-workers:local
    container_name: warehouse-iot-analytics
    profiles: ["iot"]
    command: ["python", "-m", "iot_analytics_worker.main"]
    environment: *iot-worker-env
    depends_on:
      central-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  batch-job:
    build:
      context: ../../services/batch
    profiles: ["batch"]
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-warehouse-platform}
      WAREHOUSE_URLS: '{"WH-001":"http://wh001-api:8000","WH-002":"http://wh002-lb","WH-003":"http://wh003-api:8000"}'
    volumes:
      - ~/.aws:/root/.aws:ro
volumes:
  central_postgres_data:
  multi_rabbitmq_data:
  wh001_postgres_data:
  wh002_postgres_data:
  wh003_postgres_data:
  prometheus_data:
  mosquitto_data:
  iot_sim_data:
