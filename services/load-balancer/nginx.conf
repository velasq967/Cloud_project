# Balanceador de WH-002 (fase 5)
# resolve: si una replica se apaga sale del pool y cuando vuelve se agrega sola

resolver 127.0.0.11 valid=5s ipv6=off;

upstream wh002_api {
    zone wh002_api 64k;
    server wh002-api-1:8000 resolve max_fails=1 fail_timeout=5s;
    server wh002-api-2:8000 resolve max_fails=1 fail_timeout=5s;
    server wh002-api-3:8000 resolve max_fails=1 fail_timeout=5s;
}

server {
    listen 80;

    location = /lb-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://wh002_api;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
        proxy_connect_timeout 1s;
        proxy_read_timeout 10s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        add_header X-Upstream $upstream_addr always;
    }
}
