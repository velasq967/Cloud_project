[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-common"
version = "0.1.0"
description = "Utilidades compartidas de la plataforma Warehouse Cloud"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6,<2.7",
    "pydantic-settings>=2.2,<2.3",
    "SQLAlchemy>=2.0,<2.1",
    "starlette>=0.36,<0.37",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["warehouse_common*"]
