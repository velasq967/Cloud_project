[project]
name = "warehouse-cloud-platform"
version = "0.1.0"
description = "Plataforma distribuida de bodegas — Computación en la Nube e IoT"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"services/warehouse-api/tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["services/warehouse-api/tests", "services/workers/tests", "services/central/tests"]
pythonpath = [
  "libs/common",
  "services/warehouse-api",
  "services/workers",
  "services/central",
]
addopts = "-ra"
